spring.application.name=recruito-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/recruito
spring.datasource.username=yashvardhan
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

recruito.jwt.secret=change-this-to-a-long-random-string-at-least-32-chars-long
recruito.jwt.expiration-ms=86400000

recruito.upload.dir=uploads/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB